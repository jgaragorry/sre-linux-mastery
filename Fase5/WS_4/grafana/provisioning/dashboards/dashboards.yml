apiVersion: 1

providers:
  - name: 'ws4-dashboards'
    orgId: 1
    folder: 'WS_4 - Observabilidad'
    folderUid: 'ws4-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
