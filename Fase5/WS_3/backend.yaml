apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: tienda-online
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo
        args:
        - "-text=Hola desde el Backend de la Tienda"
        ports:
        - containerPort: 5678
