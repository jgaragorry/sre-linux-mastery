---
- name: "Aprovisionamiento SRE: Nginx Dashboard y Hardening Base"
  hosts: all
  become: true
  tasks:
    - name: "Actualizar repositorio de paquetes APT"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "Instalar Nginx y utilidades de monitoreo"
      ansible.builtin.apt:
        name:
          - nginx
          - curl
          - htop
        state: present

    - name: "Desplegar Dashboard Tangible SRE con IP Dinámica"
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>AWS SRE & FinOps Live Dashboard</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
                  .card { background: #1e293b; border-radius: 16px; padding: 35px; max-width: 750px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
                  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 20px; margin-bottom: 25px; }
                  .title { font-size: 22px; font-weight: 700; color: #38bdf8; }
                  .badge { background: #166534; color: #4ade80; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; border: 1px solid #22c55e; }
                  .highlight-box { background: #0284c7; color: #ffffff; padding: 15px; border-radius: 10px; margin-bottom: 25px; text-align: center; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; border: 1px solid #38bdf8; }
                  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 25px; }
                  .info-item { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #38bdf8; }
                  .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
                  .value { font-size: 15px; color: #f1f5f9; font-family: monospace; margin-top: 6px; font-weight: 600; word-break: break-all; }
                  .timeline { background: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
                  .timeline-title { font-size: 14px; color: #cbd5e1; font-weight: 700; margin-bottom: 12px; }
                  .step { font-size: 13px; color: #94a3b8; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
                  .step span { color: #38bdf8; font-weight: 700; }
                  .footer { margin-top: 25px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #334155; padding-top: 15px; }
              </style>
          </head>
          <body>
              <div class="card">
                  <div class="header">
                      <div class="title">SRE & FinOps Live Node Dashboard</div>
                      <div class="badge">SYSTEM ONLINE</div>
                  </div>

                  <!-- Bloque visible con la IP que se debe verificar -->
                  <div class="highlight-box">
                      🌐 URL de Verificación Web: http://{{ ansible_host }}
                  </div>

                  <div class="grid">
                      <div class="info-item">
                          <div class="label">Instancia AWS EC2</div>
                          <div class="value">Ubuntu 24.04 LTS (t3.micro)</div>
                      </div>
                      <div class="info-item">
                          <div class="label">Capa de Costos</div>
                          <div class="value">AWS Free Tier ($0.00)</div>
                      </div>
                      <div class="info-item">
                          <div class="label">Disco EBS / Encriptación</div>
                          <div class="value">8 GB GP3 (Encrypted)</div>
                      </div>
                  </div>

                  <div class="timeline">
                      <div class="timeline-title">Secuencia de Aprovisionamiento Exitoso:</div>
                      <div class="step"><span>1. Shell Idempotente:</span> Bucket S3 Remote State asegurado con SSE-S3.</div>
                      <div class="step"><span>2. Terragrunt v0.60+:</span> Orquestación multi-ambiente con root.hcl.</div>
                      <div class="step"><span>3. Terraform CLI:</span> Síntesis declarativa de Security Group, Keys y EC2.</div>
                      <div class="step"><span>4. Ansible Engine:</span> Hardening base y despliegue del motor Nginx.</div>
                  </div>

                  <div class="footer">
                      Infraestructura Aprovisionada con <strong>IaC & CaC Automation</strong> — SRE 2026
                  </div>
              </div>
          </body>
          </html>

    - name: "Asegurar que Nginx está activo"
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: "MOSTRAR IP EN CONSOLA (Instructores / Estudiantes)"
      ansible.builtin.debug:
        msg:
          - "========================================================"
          - " 🚀 DESPLIEGUE Y APROVISIONAMIENTO EXITOSO"
          - " 🌐 Verifica el Dashboard en tu navegador:"
          - "    http://{{ ansible_host }}"
          - "========================================================"
